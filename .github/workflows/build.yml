name: Build Granat

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Budowanie granatu
        run: mvn -B clean package

      - name: Udostepnienie pluginu
        uses: actions/upload-artifact@v4
        with:
          name: Granat-plugin
          path: target/Granat-1.0.1.jar
          if-no-files-found: error
